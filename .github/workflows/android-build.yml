name: Android APK

# Compila el APK en GitHub (no hace falta tener Flutter en la maquina) y lo
# deja como artefacto descargable: Actions -> esta corrida -> "Artifacts" ->
# app-release-apk. Corre en cada cambio de mobile/ en master y tambien a
# mano (workflow_dispatch).
#
# Firma con la clave de debug del runner (igual que `flutter build apk` en
# una maquina sin keystore propia): el APK se instala, pero como la clave es
# distinta a la de un APK compilado en otra maquina, si el celular ya tiene
# la app instalada con otra firma hay que desinstalarla antes.

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
