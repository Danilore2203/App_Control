<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    `--base-href` de `flutter build web` reemplaza este valor. El backend
    la sirve en /app/ (ver mobile/publicar_web.sh).
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Controles · Monitoreo y alertas de Centinela DWH">
  <meta name="theme-color" content="#101312">

  <!-- iPhone: «Agregar a pantalla de inicio» la abre a pantalla completa, como una app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Controles">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Controles</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #101312; }
    #cargando {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; color: #9aa39f;
      font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #cargando img { width: 72px; height: 72px; border-radius: 18px; }
  </style>
</head>
<body>
  <div id="cargando"><img src="icons/Icon-192.png" alt=""><span>Cargando Controles…</span></div>
  <!-- Mide la muesca y la barra de inicio del iPhone: Flutter web no las informa
       y la app las lee con leerAreaSegura() (lib/utils/area_segura_web.dart). -->
  <div id="area-segura" aria-hidden="true" style="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>
  <div id="sugerencia-inicio" hidden>
    <span>Para usarla como app: toca <b>Compartir</b> (el cuadrado con la flecha hacia arriba) y luego <b>«Agregar a pantalla de inicio»</b>.</span>
    <button type="button" aria-label="Cerrar">×</button>
  </div>
  <style>
    #sugerencia-inicio {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10;
      display: flex; gap: 10px; align-items: center; padding: 12px 12px 12px 16px; border-radius: 16px;
      background: #1d2321; color: #e6ebe8; border: 1px solid #3a423f; box-shadow: 0 10px 30px rgba(0,0,0,.45);
      font: 500 13.5px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #sugerencia-inicio[hidden] { display: none; }
    #sugerencia-inicio b { color: #d4e157; }
    #sugerencia-inicio button {
      flex: none; width: 30px; height: 30px; border: 0; border-radius: 15px; background: #2c3431;
      color: #e6ebe8; font-size: 18px; line-height: 30px; cursor: pointer;
    }
  </style>
  <script>
    function leerAreaSegura() {
      var el = document.getElementById("area-segura");
      if (!el) return { top: 0, right: 0, bottom: 0, left: 0 };
      var s = getComputedStyle(el);
      return {
        top: parseFloat(s.paddingTop) || 0, right: parseFloat(s.paddingRight) || 0,
        bottom: parseFloat(s.paddingBottom) || 0, left: parseFloat(s.paddingLeft) || 0,
      };
    }
    // Se quita el aviso de carga apenas Flutter dibuja la primera pantalla.
    window.addEventListener("flutter-first-frame", function () {
      var el = document.getElementById("cargando");
      if (el) el.remove();
    });
    // En Safari del iPhone (no abierta desde la pantalla de inicio) se sugiere
    // agregarla una vez; cerrada, no vuelve a aparecer en ese celular.
    (function () {
      var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      var instalada = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
      var cerrada = false;
      try { cerrada = localStorage.getItem("sugerencia-inicio") === "cerrada"; } catch (e) {}
      if (!ios || instalada || cerrada) return;
      var aviso = document.getElementById("sugerencia-inicio");
      aviso.hidden = false;
      aviso.querySelector("button").addEventListener("click", function () {
        aviso.hidden = true;
        try { localStorage.setItem("sugerencia-inicio", "cerrada"); } catch (e) {}
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
