# Receta de despliegue para Render (plan Free): New -> Blueprint -> este repo.
# Render lee este archivo, crea el servicio y pide los valores de las
# variables marcadas con sync: false.
#
# El plan Free duerme el servicio tras 15 min sin trafico y tarda ~30-60 s en
# despertar; el timer de respaldo del poller y el resumen horario solo corren
# despierto. Para mantenerlo despierto las 24 h (entra en las 750 h/mes del
# plan) configurar un ping externo gratuito, p.ej. cron-job.org, con
# GET https://<servicio>.onrender.com/health cada 5 minutos.
services:
  - type: web
    name: centinela-dwh-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false # postgresql+psycopg://...aivencloud.com:PUERTO/defaultdb?sslmode=require
      - key: JWT_SECRET
        sync: false # usar el mismo que en Railway para no invalidar sesiones
      - key: INTERNAL_API_KEY
        sync: false # la misma OP_APP_CONTROL_INTERNAL_KEY de OP_PROD
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false # contenido completo del JSON de la cuenta de servicio de Firebase
      - key: MONITOR_AUTH_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: CRITICAL_ALERTS_ENABLED
        value: "false"
